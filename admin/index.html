<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Hardenwire</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Playfair+Display:wght@600..800&family=Lora:wght@400..700&family=DM+Sans:wght@400..700&family=Libre+Baskerville:wght@400;700&family=Source+Serif+4:wght@400..700&family=Source+Sans+3:wght@400..700&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Login -->
  <main class="login" id="login" hidden>
    <form class="login__card" id="login-form">
      <div class="brand"><span class="brand__mark">H</span><span>Harden<b>wire</b> admin</span></div>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn btn--primary" type="submit">Log in</button>
      <p class="form-msg" id="login-msg" role="alert"></p>
      <p class="hint">First run? The password is in <code>data/admin-password.txt</code>.</p>
    </form>
  </main>

  <!-- App -->
  <div class="app" id="app" hidden>
    <aside class="side">
      <div class="brand"><span class="brand__mark">H</span><span>Harden<b>wire</b></span></div>
      <nav class="nav">
        <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
        <a href="#/posts" data-nav="posts">Posts</a>
        <a href="#/messages" data-nav="messages">Messages <span class="count" id="unread-count" hidden></span></a>
        <a href="#/subscribers" data-nav="subscribers">Subscribers</a>
        <a href="#/settings" data-nav="settings">Settings</a>
      </nav>
      <div class="side__foot">
        <a href="/" target="_blank" rel="noopener">View site ↗</a>
        <button class="link" id="logout" type="button">Log out</button>
      </div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="admin.js"></script>
</body>
</html>
